.theme-switch__sun-moon-container:hover::after{opacity:1}

const E={"ما هي البرمجة؟": "console¦ده الكائن اللي بيتحكم في «الكونسول» يعني شاشة الطباعة بتاعة المتصفح؛؛ .¦النقطة معناها «هات اللي جوه»: console.log يعني هات أمر log من جوه console؛؛ log¦اسم الأمر، ومعناه «اطبع» اللي في القوسين؛؛ ( )¦القوسين بيشيلوا الحاجة اللي عايزين نطبعها؛؛ \" \"¦علامتين التنصيص بيقولوا للكمبيوتر «ده كلام عادي مش أمر»؛؛ ;¦الفاصلة المنقوطة زي النقطة في آخر الجملة: خلصنا الأمر؛؛مرحبا¦الكلام اللي بين التنصيص بيتطبع زي ما هو بالظبط، حتى العربي؛؛ حروف كبيرة وصغيرة¦Console مش زي console: أي حرف كبير غلط والأمر مش هيشتغل؛؛ ' '¦التنصيص المفرد شغال زي المزدوج، المهم تقفل بنفس النوع اللي فتحت بيه؛؛ ` `¦علامة الباك تيك بتسمح تحط متغير جوه النص بالشكل ${اسم}؛؛ ${ }¦بتدخل قيمة متغير وسط نص مكتوب بباك تيك؛؛ =¦واحدة معناها «ضع القيمة»؛؛ ==¦اتنين يساووا معناها «هل القيمتين متساويتين؟»؛؛ ===¦تلاتة يساووا نفس السؤال لكن بتقارن النوع كمان فهي الأدق؛؛ !=¦معناها «مش يساوي»؛؛ <¦أصغر من؛؛ >¦أكبر من؛؛ <=¦أصغر من أو يساوي؛؛ >=¦أكبر من أو يساوي؛؛ +=¦زوّد على القيمة الحالية: x += 2 يعني x = x + 2؛؛ ++¦زوّد واحد؛؛ --¦نقّص واحد؛؛ -¦طرح؛؛ *¦ضرب؛؛ /¦قسمة؛؛ %¦باقي القسمة؛؛ &&¦معناها «و»؛؛ ||¦معناها «أو»؛؛ !¦معناها «مش»؛؛ :¦نقطتين، بتفصل المفتاح عن قيمته جوه الكائن؛؛ ,¦فاصلة بتفصل بين العناصر؛؛ /* */¦تعليق طويل بيتكتب على كذا سطر والكمبيوتر بيتجاهله", "المتغيرات": "let¦كلمة بتعمل متغير جديد ممكن قيمته تتغير بعدين؛؛ const¦بتعمل متغير ثابت، أول ما تحط فيه قيمة مش هتقدر تغيرها؛؛ age / name¦اسم المتغير، إنت اللي بتختاره بس من غير مسافات؛؛ =¦علامة الوضع: بتحط القيمة اللي على اليمين جوه المتغير (مش معناها «يساوي»)؛؛ 20¦رقم بنكتبه من غير تنصيص؛؛ +¦بتجمع الأرقام، وبتلزّق النصوص ببعض؛؛ \" \"¦تنصيص فيه مسافة عشان الاسم والسن ما يلزقوش في بعض؛؛Ali¦نص بيتحط بين تنصيص، وأول حرف كبير مجرد عادة مش قاعدة؛؛ ;¦في آخر كل سطر تعريف؛؛ المسافات حوالين =¦للراحة بس، لكن مسافة بعد let ضرورية؛؛ حروف الاسم¦الاسم لازم يبدأ بحرف مش برقم، وما يكونش فيه مسافة", "أنواع البيانات": "typeof¦كلمة بتقولك نوع القيمة اللي بعدها؛؛ \"hi\"¦نص (string) لأنه بين تنصيص؛؛ 25¦رقم (number) لأنه من غير تنصيص؛؛ true¦قيمة منطقي 1>¦أكبر عنوان، و h1 معناها Heading 1؛؛<¦علامة أصغر من، في HTML معناها «هنا بيبدأ وسم»؛؛ >¦علامة أكبر من، معناها «هنا الوسم خلص»؛؛ /¦السلاش قبل اسم الوسم معناها «ده وسم القفل»؛؛ !¦علامة التعجب في أول DOCTYPE معناها «ده مش وسم عادي، ده إعلان للمتصفح»؛؛ DOCTYPE¦كلمة معناها «نوع المستند»؛؛ html (اللي بعد DOCTYPE)¦بتحدد إن نوع المستند صفحة HTML؛؛ المسافة بين DOCTYPE و html¦لازم تفصل بين الكلمتين؛؛ الكلام العربي بين الوسمين¦نص عادي بيظهر في الصفحة زي ما هو؛؛ النزول لسطر جديد والإزاحة¦للترتيب بس والمتصفح بيتجاهلها؛؛ حروف كبيرة وصغيرة¦مالهاش فرق في HTML لكن الأفضل تكتب الوسوم بحروف صغيرة", "HTML: العناوين والفقرات والتنسيق": "<h1>¦أكبر عنوان وأهمه، بنستخدمه مرة واحدة بس في الصفحة للعنوان الرئيسي؛؛ <h2>¦عنوان فرعي تحت h1 وأصغر منه شوية، بنستخدمه لأقسام الصفحة زي «عن الكورس»؛؛ <h3>¦عنوان تحت h2، بيقسّم القسم لأجزاء أصغر؛؛ <h4>¦عنوان تحت h3، بيتستخدم لتفاصيل دقيقة وقليل ما بتحتاجه؛؛ <h5>¦عنوان صغير جدا تحت h4؛؛ <h6>¦أصغر عنوان وأقلهم أهمية، حجمه قريب من الكلام العادي؛؛ h1 ← h6¦الرقم بيصغّر العنوان: 1 الأكبر و6 الأصغر، والأفضل تمشي بالترتيب ومتقفزش من h2 لـ h5؛؛ </h2> </h3> </h4> </h5> </h6>¦كل عنوان بيتقفل بنفس رقمه، فتحت h3 يبقى تقفله </h3> مش </h2>؛؛ <h7>¦مفيش h7! لو كتبته المتصفح مش هيعتبره عنوان وهيطلع كلام عادي؛؛ <p>¦الـ p اختصار Paragraph يعني فقرة؛؛ <strong>¦بيخلي الكلمة عريضة (Bold) ومهمة؛؛ <em>¦بيخلي الكلمة مايلة عشان نأكد عليها؛؛ <br>¦بينزّل سطر جديد، وده مش بيتقفل؛؛ </p>¦السلاش / معناها «قفلنا»؛ نفس اسم الوسم بس بسلاش؛؛<strong> جوه <p>¦وسم جوه وسم: لازم تقفل الداخلي الأول وبعدين الخارجي؛؛ عن الكورس¦نص العنوان اللي هيظهر للناس؛؛ جدا¦كلام عادي بعد الوسم بيكمل الجملة", "HTML: الروابط والصور": "<a>¦الـ a اختصار Anchor يعني رابط الواحد بيدوس عليه؛؛ href¦عنوان المكان اللي الرابط هيودّيك له؛؛ =¦بتربط اسم الخاصية بقيمتها؛؛ \"https://…\"¦علامتين التنصيص بيلفوا قيمة الخاصية؛؛ زر الموقع¦الكلام اللي بين الوسمين هو اللي بيظهر للناس؛؛ <img>¦صورة (Image)، وملهاش وسم قفل؛؛ src¦مكان ملف الصورة (Source)؛؛ alt¦وصف للصورة بالكلام لو ما فتحتش أو للمكفوفين؛؛المسافة بين a و href¦لازم تفصل
