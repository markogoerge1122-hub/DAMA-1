<title>DAMA code</title>

<style>
/* ===== DAMA code v3 — تصميم جديد ===== */
:root{
 --bg:#f6f7fb;--card:#ffffff;--tx:#14162b;--mu:#697089;
 --pr:#5b4bff;--pr2:#8b5cf6;--onpr:#ffffff;--ok:#0f9d63;--bad:#e0345f;
 --bd:#e3e6f0;--hl:#ffd93d;--grid:transparent;
 --rad:18px;--bw:1px;--sh:0 1px 2px rgba(20,22,43,.04),0 8px 24px -12px rgba(20,22,43,.12);
 --hf:"Cairo",Tahoma,"Segoe UI",sans-serif;--bf:"Cairo",Tahoma,"Segoe UI",sans-serif;
 color-scheme:light;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{
 --bg:#07080f;--card:#10121d;--tx:#f1f2fa;--mu:#9aa0b8;
 --pr:#8b7dff;--pr2:#b18cff;--onpr:#0a0a14;--ok:#3bd88a;--bad:#ff7096;
 --bd:#23263a;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;color:var(--tx);font:16px/1.8 var(--bf);-webkit-font-smoothing:antialiased;
 background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--pr) 16%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 0,color-mix(in srgb,var(--pr2) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.w{max-width:700px;margin:auto;padding:76px 16px 40px}
h1{margin:0 0 6px;font:800 36px/1.2 var(--hf);letter-spacing:-.5px}
h1 span{background:linear-gradient(135deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 22px/1.4 var(--hf);margin:.7em 0 .3em}
h3{display:flex;align-items:center;gap:10px;margin:30px 0 8px;font:800 14px/1.4 var(--hf);color:var(--mu)}
h3::before{content:"";width:22px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--pr2));flex:none}
p{margin:.5em 0}a{color:var(--pr)}code{font-family:ui-monospace,Consolas,monospace}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:var(--bw) solid var(--bd);border-radius:var(--rad);padding:18px;margin:12px 0;box-shadow:var(--sh)}
button,button.fx{width:auto;height:auto;margin:6px 4px;padding:10px 20px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);border:0;border-radius:12px;font:700 15px var(--bf);cursor:pointer;box-shadow:0 6px 16px -8px var(--pr);transition:opacity .15s,transform .1s,box-shadow .15s}
button:not(:disabled):hover{opacity:.92;box-shadow:0 8px 20px -8px var(--pr)}
button:not(:disabled):active{transform:scale(.97)}
button.g{background:transparent;color:var(--tx);border:var(--bw) solid var(--bd);box-shadow:none}
button.g:not(:disabled):hover{background:color-mix(in srgb,var(--pr) 8%,transparent);opacity:1;box-shadow:none}
button:disabled,.fx:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.fx .clip,.fx .arrow{display:none}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:var(--bw) solid var(--bd);border-radius:12px;padding:12px 14px;font:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 20%,transparent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--pr)}
textarea{min-height:190px;direction:ltr;text-align:left;font:14px/1.7 ui-monospace,Consolas,monospace;background:var(--card)}
pre{direction:ltr;text-align:left;background:var(--bg);border:var(--bw) solid var(--bd);padding:12px 14px;border-radius:12px;overflow-x:auto}
.input-container{max-width:340px;margin:10px 0 6px}.input{height:52px;font-size:17px}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.l{display:flex;align-items:center;gap:10px;padding:12px 14px;border:var(--bw) solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card);transition:background .15s,border-color .15s}
.l:hover{border-color:var(--pr)}
.l.s{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
.bar{height:10px;border-radius:99px;overflow:hidden;background:var(--bd)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .5s ease}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.tb td{border:1px solid var(--bd);padding:7px 10px;vertical-align:top}
.tb td:first-child{white-space:nowrap;width:1%;background:var(--bg)}
.c0{--c:#e0457b}.c1{--c:#2f80ed}.c2{--c:#0fa968}.c3{--c:#e58a00}.c4{--c:#8b5cf6}.c5{--c:#d6453d}
.ex{display:flex;flex-direction:column;gap:4px;border-right:4px solid var(--c);background:var(--bg);border-radius:12px;padding:10px 14px;margin:8px 0}
.ex code{align-self:flex-start;background:var(--c);color:#fff;padding:2px 10px;border-radius:8px;font-weight:700}
.tip{white-space:pre-wrap;unicode-bidi:plaintext;background:color-mix(in srgb,var(--pr) 10%,transparent);border-radius:12px;padding:12px 14px;margin:10px 0}
.tip.warn{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.hdemo{background:var(--bg);border:var(--bw) solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
.hdemo h1{font-size:2em;margin:4px 0}.hdemo h2,.hdemo h3,.hdemo h4,.hdemo h5,.hdemo h6{margin:4px 0}
.tsw{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:9;display:inline-block;direction:ltr;cursor:pointer}
.tsw input{position:absolute;opacity:0;pointer-events:none}
.tk{display:block;position:relative;width:56px;height:32px;border-radius:99px;background:var(--card);border:var(--bw) solid var(--bd);box-shadow:var(--sh);transition:background .2s}
.tk i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;line-height:1;transition:transform .22s ease}
.tk i::before{content:"☀"}
.tsw input:checked+.tk i{transform:translateX(24px)}
.tsw input:checked+.tk i::before{content:"☾"}
.tsw input:focus-visible+.tk{outline:2px solid var(--pr);outline-offset:2px}
/* شاشة الدخول */
.hero{text-align:center;padding:10px 0 4px}
.hero .logo{width:68px;height:68px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:flex;align-items:center;justify-content:center;font:800 26px var(--hf);box-shadow:0 14px 30px -12px var(--pr)}
.auth{max-width:440px;margin:16px auto}
.auth .tabs{display:flex;gap:6px;background:var(--bg);border:var(--bw) solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.auth .tabs button{flex:1;margin:0;box-shadow:none;background:transparent;color:var(--mu)}
.auth .tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr)}
.auth button.full{width:100%;margin:8px 0 0}
.auth .or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:12px 0}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--bd)}
.auth .f{margin:8px 0}
.adb{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:9;margin:0;padding:7px 14px;font-size:13px;border-radius:99px;background:var(--card);color:var(--tx);border:var(--bw) solid var(--bd);box-shadow:var(--sh)}

/* ===== شاشة الدرس (v3) ===== */
.lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lh .tmr{margin-inline-start:auto;color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.chip{padding:3px 12px;border-radius:99px;font:700 13px var(--bf);color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
button.sm{padding:6px 14px;font-size:13px;margin:0}
.lt{margin:12px 0 4px;font-size:26px}
.stp{display:flex;align-items:flex-start;margin:14px 0 18px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:12.5px;color:var(--mu);font-weight:700}
.st::before{content:"";position:absolute;top:17px;inset-inline:-50% 50%;height:3px;background:var(--bd);z-index:0}
.st:first-child::before{display:none}
.st i{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.st.d i{background:var(--ok);border-color:var(--ok);color:#fff}.st.d::before,.st.a::before{background:var(--ok)}
.st.a{color:var(--tx)}.st.a i{border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 20%,transparent)}
.lx{font-size:17px;line-height:2}
.lx p{margin:.6em 0}
.lx code,.tip code,.ex span code{background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr);padding:1px 7px;border-radius:7px;font-size:.92em}
.lx pre,.card pre{background:#0d1020;color:#e8eaff;border:0;border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.8;margin:12px 0 6px}
.lx pre code{background:none;color:inherit;padding:0}
pre~button.g{padding:6px 12px;font-size:13px;margin:4px 3px}
.card h4{margin:0 0 10px;font:800 17px var(--hf)}
.ex{background:var(--bg);border-right:0;border-inline-start:4px solid var(--c);box-shadow:none}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.act button{flex:1;min-width:120px;margin:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dots button.dot{width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:var(--bg);color:var(--mu);border:var(--bw) solid var(--bd);box-shadow:none;font-size:13px}
.dots button.dot.ok2{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:var(--ok)}
.dots button.dot.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.qq{font:800 20px/1.7 var(--hf);margin:6px 0 12px;unicode-bidi:plaintext}
.opt{position:relative;padding:14px;margin:10px 0;border-width:2px;font-size:16px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{flex:none;width:32px;height:32px;border-radius:10px;background:var(--bg);border:var(--bw) solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.s b{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.opt span{unicode-bidi:plaintext;flex:1}
.task{font-size:18px;font-weight:700;margin:.3em 0;line-height:1.9}
.ckl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.ckl li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg);border:var(--bw) solid var(--bd);font-size:14.5px;transition:all .2s}
.ckl li i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.ckl li.y{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.ckl li.y i{background:var(--ok);border-color:var(--ok)}
.ed{border-radius:16px;overflow:hidden;border:var(--bw) solid #23263a;background:#0d1020;margin:12px 0 0}
.edh{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#161a2e;color:#9aa0b8;font:700 12px ui-monospace,monospace;direction:ltr}
.edh em{display:flex;gap:6px;font-style:normal}.edh em i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.edh em i:nth-child(2){background:#febc2e}.edh em i:nth-child(3){background:#28c840}
.ed textarea{border:0;border-radius:0;background:#0d1020;color:#e8eaff;min-height:230px;box-shadow:none!important}
.sc{text-align:center}
.ring{width:130px;height:130px;margin:6px auto 8px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:8px solid var(--ok);color:var(--ok)}
.ring.f{border-color:var(--bad);color:var(--bad)}.ring b{font:800 38px var(--hf)}.ring span{font-size:13px;color:var(--mu)}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.sgrid div{background:var(--bg);border:var(--bw) solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-direction:column}
.sgrid span{font-size:12.5px;color:var(--mu)}.sgrid b{font-size:16px}
.tiles{display:grid;gap:12px;margin-top:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;margin:0;padding:18px;text-align:start;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.tile:not(:disabled):hover{border-color:var(--pr);opacity:1}
.tile .ti{flex:none;width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--pr) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:26px}
.tile .tt{display:flex;flex-direction:column;line-height:1.5}.tile b{font-size:19px}.tile small{color:var(--mu);font-size:14px;font-weight:600}
.tile.ok{border-color:var(--ok)}.tile.ok .ti{background:var(--ok);color:#fff}
.hook{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--pr) 10%,transparent);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:700}
.lx h4{margin:20px 0 6px;font:800 17px var(--hf);color:var(--pr)}.lx h4:first-child{margin-top:0}
.lx ul{margin:8px 0;padding-inline-start:22px}.lx li{margin:6px 0}
/* ===== مقدمة الدخول: شخصية تتسلق الحبل وصفحة الدخول تقع ===== */
html.ni{background:#000}html.ni body>*{visibility:hidden}
#intro{position:fixed;inset:0;z-index:6000;overflow:hidden;perspective:600px;transition:opacity .9s ease;
 background:radial-gradient(60% 45% at 50% 100%,#2a1f6b55,transparent 70%),radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 65%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 35% 80%,#fff5 50%,transparent 51%),#000}
#intro.out{opacity:0;pointer-events:none}
#intro::before{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 42%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 28% 62%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 88%,#fff 50%,transparent 51%);animation:twk 2.6s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:.9}}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,#000 100%);pointer-events:none}
#intro .skip{position:absolute;z-index:3;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;color:#ffffff66;font-size:13px;animation:skipIn .6s 1.2s both}
@keyframes skipIn{from{opacity:0}to{opacity:1}}
#intro .prog{position:absolute;z-index:3;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:50%;width:120px;height:3px;margin-left:-60px;border-radius:9px;background:#ffffff1f;overflow:hidden}
#intro .prog i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#8b7dff,#b18cff);transform-origin:0 50%;animation:progF 7s linear forwards}
@keyframes progF{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#intro .ttl{position:absolute;z-index:1;left:0;right:0;top:42%;text-align:center;color:#fff;font:800 30px/1 var(--hf);direction:ltr;opacity:0;text-shadow:0 0 22px #8b7dff,0 0 60px #8b7dff88;animation:ttlA 3.8s ease-out forwards}
@keyframes ttlA{0%{opacity:0;letter-spacing:-2px;transform:scale(.92)}22%{opacity:1;letter-spacing:5px;transform:scale(1)}70%{opacity:.9;letter-spacing:6px}100%{opacity:0;letter-spacing:12px;transform:translateY(-30px)}}
.rope{position:absolute;z-index:1;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:4px;background:repeating-linear-gradient(180deg,#c9bfff 0 7px,#7a68f0 7px 14px);background-size:100% 14px;box-shadow:0 0 16px #8b7dff,0 0 40px #8b7dff66;opacity:.9;animation:ropeF .45s linear infinite}
@keyframes ropeF{to{background-position:0 14px}}
.pt{position:absolute;bottom:-30px;color:#ffffff1f;font:700 20px ui-monospace,monospace;animation:pf linear infinite}
@keyframes pf{to{transform:translateY(-115vh) rotate(25deg)}}
/* الشخصية وهي بتتسلق */
.clm{position:absolute;z-index:2;left:50%;width:62px;margin-left:-31px;bottom:-140px;animation:clmUp 7s forwards}
.clm::after{content:"";position:absolute;left:50%;top:40%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,#8b7dff40,transparent 65%);pointer-events:none;z-index:-1}
@keyframes clmUp{0%{bottom:-140px;animation-timing-function:cubic-bezier(.25,.1,.35,1)}38%{bottom:calc(50% - 54px);animation-timing-function:linear}64%{bottom:calc(50% - 54px);animation-timing-function:cubic-bezier(.55,0,.85,.7)}100%{bottom:calc(100% + 40px)}}
.clmw{transform-style:preserve-3d;animation:clmX2 .55s ease-in-out infinite alternate}
@keyframes clmX2{from{transform:translateX(-3px) rotateY(-20deg)}to{transform:translateX(3px) rotateY(20deg)}}
.clm svg{animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-2.5deg) translateY(2px)}to{transform:rotate(2.5deg) translateY(-3px)}}
.clm .a1{animation:armC1 .55s ease-in-out infinite alternate}.clm .a2{animation:armC2 .55s ease-in-out infinite alternate-reverse}
@keyframes armC1{from{transform:translateY(-7px) rotate(16deg)}to{transform:translateY(11px) rotate(16deg)}}
@keyframes armC2{from{transform:translateY(-7px) rotate(-16deg)}to{transform:translateY(11px) rotate(-16deg)}}
.clm .l1{animation:legS .55s ease-in-out infinite alternate}.clm .l2{animation:legS .55s ease-in-out infinite alternate-reverse}
@keyframes legS{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
/* الشخصية المعلّقة جنب كارت الدخول */
#hang{position:absolute;z-index:8;width:56px;pointer-events:none;perspective:420px;display:none}
.swing{transform-origin:50% 2%;transform-style:preserve-3d;animation:sw 2.6s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-15deg) rotateY(-14deg)}to{transform:rotate(15deg) rotateY(14deg)}}
.hg .bd{animation:lag 2.6s ease-in-out infinite alternate}
@keyframes lag{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
.hg .l1{animation:legH 1.3s ease-in-out infinite alternate}.hg .l2{animation:legH 1.3s ease-in-out infinite alternate-reverse}
@keyframes legH{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.hg .a1,.hg .a2{transform:none}
.ey{animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* وقوع الصفحة */
body.intro-on .w,body.intro-on #hang{transform:translateY(-135vh)}

const E={"ما هي البرمجة؟": "console¦ده الكائن اللي بيتحكم في «الكونسول» يعني شاشة الطباعة بتاعة المتصفح؛؛ .¦النقطة معناها «هات اللي جوه»: console.log يعني هات أمر log من جوه console؛؛ log¦اسم الأمر، ومعناه «اطبع» اللي في القوسين؛؛ ( )¦القوسين بيشيلوا الحاجة اللي عايزين نطبعها؛؛ \" \"¦علامتين التنصيص بيقولوا للكمبيوتر «ده كلام عادي مش أمر»؛؛ ;¦الفاصلة المنقوطة زي النقطة في آخر الجملة: خلصنا الأمر؛؛مرحبا¦الكلام اللي بين التنصيص بيتطبع زي ما هو بالظبط، حتى العربي؛؛ حروف كبيرة وصغيرة¦Console مش زي console: أي حرف كبير غلط والأمر مش هيشتغل؛؛ ' '¦التنصيص المفرد شغال زي المزدوج، المهم تقفل بنفس النوع اللي فتحت بيه؛؛ ` `¦علامة الباك تيك بتسمح تحط متغير جوه النص بالشكل ${اسم}؛؛ ${ }¦بتدخل قيمة متغير وسط نص مكتوب بباك تيك؛؛ =¦واحدة معناها «ضع القيمة»؛؛ ==¦اتنين يساووا معناها «هل القيمتين متساويتين؟»؛؛ ===¦تلاتة يساووا نفس السؤال لكن بتقارن النوع كمان فهي الأدق؛؛ !=¦معناها «مش يساوي»؛؛ <¦أصغر من؛؛ >¦أكبر من؛؛ <=¦أصغر من أو يساوي؛؛ >=¦أكبر من أو يساوي؛؛ +=¦زوّد على القيمة الحالية: x += 2 يعني x = x + 2؛؛ ++¦زوّد واحد؛؛ --¦نقّص واحد؛؛ -¦طرح؛؛ *¦ضرب؛؛ /¦قسمة؛؛ %¦باقي القسمة؛؛ &&¦معناها «و»؛؛ ||¦معناها «أو»؛؛ !¦معناها «مش»؛؛ :¦نقطتين، بتفصل المفتاح عن قيمته جوه الكائن؛؛ ,¦فاصلة بتفصل بين العناصر؛؛ /* */¦تعليق طويل بيتكتب على كذا سطر والكمبيوتر بيتجاهله", "المتغيرات": "let¦كلمة بتعمل متغير جديد ممكن قيمته تتغير بعدين؛؛ const¦بتعمل متغير ثابت، أول ما تحط فيه قيمة مش هتقدر تغيرها؛؛ age / name¦اسم المتغير، إنت اللي بتختاره بس من غير مسافات؛؛ =¦علامة الوضع: بتحط القيمة اللي على اليمين جوه المتغير (مش معناها «يساوي»)؛؛ 20¦رقم بنكتبه من غير تنصيص؛؛ +¦بتجمع الأرقام، وبتلزّق النصوص ببعض؛؛ \" \"¦تنصيص فيه مسافة عشان الاسم والسن ما يلزقوش في بعض؛؛Ali¦نص بيتحط بين تنصيص، وأول حرف كبير مجرد عادة مش قاعدة؛؛ ;¦في آخر كل سطر تعريف؛؛ المسافات حوالين =¦للراحة بس، لكن مسافة بعد let ضرورية؛؛ حروف الاسم¦الاسم لازم يبدأ بحرف مش برقم، وما يكونش فيه مسافة", "أنواع البيانات": "typeof¦كلمة بتقولك نوع القيمة اللي بعدها؛؛ \"hi\"¦نص (string) لأنه بين تنصيص؛؛ 25¦رقم (number) لأنه من غير تنصيص؛؛ true¦قيمة منطقي 1>¦أكبر عنوان، و h1 معناها Heading 1؛؛<¦علامة أصغر من، في HTML معناها «هنا بيبدأ وسم»؛؛ >¦علامة أكبر من، معناها «هنا الوسم خلص»؛؛ /¦السلاش قبل اسم الوسم معناها «ده وسم القفل»؛؛ !¦علامة التعجب في أول DOCTYPE معناها «ده مش وسم عادي، ده إعلان للمتصفح»؛؛ DOCTYPE¦كلمة معناها «نوع المستند»؛؛ html (اللي بعد DOCTYPE)¦بتحدد إن نوع المستند صفحة HTML؛؛ المسافة بين DOCTYPE و html¦لازم تفصل بين الكلمتين؛؛ الكلام العربي بين الوسمين¦نص عادي بيظهر في الصفحة زي ما هو؛؛ النزول لسطر جديد والإزاحة¦للترتيب بس والمتصفح بيتجاهلها؛؛ حروف كبيرة وصغيرة¦مالهاش فرق في HTML لكن الأفضل تكتب الوسوم بحروف صغيرة", "HTML: العناوين والفقرات والتنسيق": "<h1>¦أكبر عنوان وأهمه، بنستخدمه مرة واحدة بس في الصفحة للعنوان الرئيسي؛؛ <h2>¦عنوان فرعي تحت h1 وأصغر منه شوية، بنستخدمه لأقسام الصفحة زي «عن الكورس»؛؛ <h3>¦عنوان تحت h2، بيقسّم القسم لأجزاء أصغر؛؛ <h4>¦عنوان تحت h3، بيتستخدم لتفاصيل دقيقة وقليل ما بتحتاجه؛؛ <h5>¦عنوان صغير جدا تحت h4؛؛ <h6>¦أصغر عنوان وأقلهم أهمية، حجمه قريب من الكلام العادي؛؛ h1 ← h6¦الرقم بيصغّر العنوان: 1 الأكبر و6 الأصغر، والأفضل تمشي بالترتيب ومتقفزش من h2 لـ h5؛؛ </h2> </h3> </h4> </h5> </h6>¦كل عنوان بيتقفل بنفس رقمه، فتحت h3 يبقى تقفله </h3> مش </h2>؛؛ <h7>¦مفيش h7! لو كتبته المتصفح مش هيعتبره عنوان وهيطلع كلام عادي؛؛ <p>¦الـ p اختصار Paragraph يعني فقرة؛؛ <strong>¦بيخلي الكلمة عريضة (Bold) ومهمة؛؛ <em>¦بيخلي الكلمة مايلة عشان نأكد عليها؛؛ <br>¦بينزّل سطر جديد، وده مش بيتقفل؛؛ </p>¦السلاش / معناها «قفلنا»؛ نفس اسم الوسم بس بسلاش؛؛<strong> جوه <p>¦وسم جوه وسم: لازم تقفل الداخلي الأول وبعدين الخارجي؛؛ عن الكورس¦نص العنوان اللي هيظهر للناس؛؛ جدا¦كلام عادي بعد الوسم بيكمل الجملة", "HTML: الروابط والصور": "<a>¦الـ a اختصار Anchor يعني رابط الواحد بيدوس عليه؛؛ href¦عنوان المكان اللي الرابط هيودّيك له؛؛ =¦بتربط اسم الخاصية بقيمتها؛؛ \"https://…\"¦علامتين التنصيص بيلفوا قيمة الخاصية؛؛ زر الموقع¦الكلام اللي بين الوسمين هو اللي بيظهر للناس؛؛ <img>¦صورة (Image)، وملهاش وسم قفل؛؛ src¦مكان ملف الصورة (Source)؛؛ alt¦وصف للصورة بالكلام لو ما فتحتش أو للمكفوفين؛؛المسافة بين a و href¦لازم تفصل
